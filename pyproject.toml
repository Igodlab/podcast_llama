[project]
name = "podcast_llama"
version = "0.1.0"
description = "AI wrappers for content creation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # "accelerate", # required by mistral-common
    "asyncio",
    "catppuccin-jupyterlab",
    "gradio>=5.15.0",
    "huggingface-hub>=0.33.4", # csm-1b
    "inflect>=7.5.0",
    "ipywidgets", # install this because of jupyterlab warning
    "jupyterlab",
    "kanjize>=1.5.0",
    "manim", # manim for text for video stuff
    # "librosa==0.10.2.post1",
    "moshi>=0.2.2", # csm-1b
    "nltk", # string processing
    "numpy>=2.2.2", # avoid incompatibility, comment numba==0.61.0 and numpy>=2.1.3
    "packaging",
    "phonemizer>=3.3.0",
    "resampy",
    "setuptools",
    "silentcipher @ git+https://github.com/SesameAILabs/silentcipher@master", # csm-1b
    "soundfile>=0.13.1",
    "sudachidict-full>=20241021",
    "sudachipy>=0.6.10",
    "tokenizers>=0.21.0", # csm-1b
    "torch>=2.4.0", # csm-1b
    "torchao>=0.9.0",
    "torchaudio>=2.4.0", # csm-1b
    "torchtune>=0.4.0", # csm-1b
    "transformers",
    "uv-sort",
    "whisper_timestamped",
    "zonos @ git+https://github.com/Zyphra/Zonos@main", # zonos-v0.1-transformer
]

# Note: Not actually optional. All the modeling code lives in mamba-ssm.
# We put them here to make the two-stage installation process easier.
[project.optional-dependencies]
compile = [
    "causal-conv1d>=1.5.0.post8",
    "flash-attn>=2.7.3",
    "mamba-ssm>=2.2.4",
]

# FIXME:
# remove using zonos as a backend and use it as a dependency instead
# [tool.setuptools.packages.find]
# include = ["zonos", "csm-1b"]

[tool.uv]
no-build-isolation-package = ["flash-attn", "mamba-ssm", "causal-conv1d"]

[tool.uv.sources]
transformers = { git = "https://github.com/huggingface/transformers.git", rev = "main" }

[tool.ruff]
line-length = 120
